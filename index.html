<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VDL-FLOW — Visual Narrative Closed-Loop Animation Pipeline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;1,14..32,300&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #1C1C1C; font-family: 'Inter', system-ui, sans-serif; }

      /* 呼吸燈效果 — 問號按鈕 */
      @keyframes vdl-breathe-glow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(167,139,250,0); border-color: #4C4E56; }
        50%      { box-shadow: 0 0 8px 2px rgba(167,139,250,0.35); border-color: #A78BFA; }
      }
      .vdl-breathe { animation: vdl-breathe-glow 2.5s ease-in-out infinite; }

      /* 隱藏滾軸，只保留圓點導航 */
      .vdl-scroll-hide { scrollbar-width: none; -ms-overflow-style: none; }
      .vdl-scroll-hide::-webkit-scrollbar { display: none; }

      /* 全域 touch target 最小值 */
      button, [role="button"], label[style*="cursor: pointer"] { min-height: 32px; }

      /* Reduced motion preference */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }

      /* RWD: 平板斷點 */
      @media (max-width: 1024px) {
        #root > div { padding: 0 12px 60px !important; }
        button, select, input { min-height: 36px; font-size: 12px !important; }
      }

      /* RWD: 手機斷點 */
      @media (max-width: 768px) {
        #root > div { padding: 0 12px 60px !important; }
        h1 { font-size: 22px !important; letter-spacing: 2px !important; }
        h3 { font-size: 13px !important; }
        pre { font-size: 10px !important; }
        button { min-height: 40px; }
        input, select, textarea { min-height: 40px; font-size: 14px !important; }
        /* 編輯面板改為全寬 */
        .vdl-scroll-hide[style*="width: 440"] { width: 100% !important; max-width: 100% !important; left: 0 !important; right: 0 !important; border-radius: 0 !important; }
      }

      @media (max-width: 480px) {
        #root > div { padding: 0 8px 40px !important; }
        h1 { font-size: 18px !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
